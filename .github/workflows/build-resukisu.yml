name: Build ReSukiSU Kernel

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build'
        type: boolean
        default: false
      debug_mode:
        description: 'Debug mode'
        type: boolean
        default: false
      ksu_version:
        description: 'ReSukiSU version'
        type: choice
        options:
          - main
          - dev
          - stable
        default: main

env:
  DEVICE: kiev
  KERNEL_BRANCH: lineage-23.2
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Setup environment
        run: |
          echo "Starting build"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip libelf-dev dwarves cpio automake autoconf lld llvm

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: /home/runner/clang
          key: clang-toolchain-v1

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/clang
          cd /home/runner/clang
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          mv clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04/* .
          rm -rf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04 clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz

      - name: Cache GCC
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/gcc-64
            /home/runner/gcc-32
          key: gcc-toolchain-v1

      - name: Download GCC
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/gcc-64 /home/runner/gcc-32
          cd /home/runner/gcc-64
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android13-release.tar.gz -O gcc64.tar.gz
          tar -xzf gcc64.tar.gz
          rm gcc64.tar.gz
          cd /home/runner/gcc-32
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/android13-release.tar.gz -O gcc32.tar.gz
          tar -xzf gcc32.tar.gz
          rm gcc32.tar.gz

      - name: Clone kernel
        run: |
          git clone --depth=1 --branch ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} kernel_sources
          cd kernel_sources
          echo "Kernel cloned"
          find arch/arm64/configs/ -name "*kiev*" -o -name "*sm8250*" | head -10

      - name: Clone ReSukiSU
        run: |
          git clone --depth=1 ${{ env.RESUKISU_REPO }} ReSukiSU
          cd ReSukiSU
          echo "ReSukiSU cloned"
          ls -la

      - name: Apply ReSukiSU
        run: |
          cd kernel_sources
          mkdir -p drivers/kernelsu
          cp -r ../ReSukiSU/kernel/* drivers/kernelsu/ 2>/dev/null || echo "No kernel dir"
          
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          if ! grep -q "kernelsu" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          
          if ! grep -q "handle_kernelsu" fs/exec.c; then
            sed -i 's/#include <linux\/fs.h>/#include <linux\/fs.h>\nextern int handle_kernelsu(int argc, char *argv[]);/' fs/exec.c
          fi
          
          echo "ReSukiSU applied"

      - name: Configure kernel
        run: |
          cd kernel_sources
          
          CONFIG=""
          for f in arch/arm64/configs/lineage_kiev_defconfig arch/arm64/configs/lineageos_kiev_defconfig arch/arm64/configs/vendor/kiev_defconfig arch/arm64/configs/kiev_defconfig; do
            if [ -f "$f" ]; then
              CONFIG="$f"
              break
            fi
          done
          
          if [ -z "$CONFIG" ]; then
            CONFIG=$(find arch/arm64/configs/ -name "*kiev*" -o -name "*sm8250*" | head -1)
          fi
          
          if [ -z "$CONFIG" ]; then
            echo "No config found"
            exit 1
          fi
          
          cp "$CONFIG" .config
          echo "Using config: $CONFIG"
          
          ./scripts/config --enable KSU
          ./scripts/config --enable KPROBES
          ./scripts/config --enable HAVE_KPROBES
          ./scripts/config --enable KPROBE_EVENTS
          ./scripts/config --enable SUSFS
          ./scripts/config --enable OVERLAY_FS
          
          make ARCH=arm64 olddefconfig
          echo "Kernel configured"

      - name: Build kernel
        run: |
          cd kernel_sources
          
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/home/runner/clang/bin:/home/runner/gcc-64/bin:/home/runner/gcc-32/bin:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip 2>&1 | tee build.log
          
          if [ -f "out/arch/arm64/boot/Image" ] || [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Build successful"
            ls -lh out/arch/arm64/boot/
          else
            echo "Build failed"
            grep -i "error:" build.log | tail -20
            exit 1
          fi

      - name: Create package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          
          rm -f Image* dtb* *.zip
          
          cp ../kernel_sources/out/arch/arm64/boot/Image.gz . 2>/dev/null || cp ../kernel_sources/out/arch/arm64/boot/Image .
          
          cat > anykernel.sh << 'HEREDOC'
          # AnyKernel3 Script
          properties() { '
          kernel.string=ReSukiSU Kernel for kiev
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=kiev
          device.name2=kiev
          device.name3=kiev
          device.name4=kiev
          device.name5=kiev
          supported.versions=14 - 16
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          . /tmp/anykernel/tools/ak3-core.sh;
          split_boot;
          flash_boot;
          HEREDOC
          
          ZIP_NAME="ReSukiSU-kiev-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP_NAME" *
          cd ..
          echo "Package created: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-kiev
          path: ReSukiSU-kiev-*.zip

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel_sources/out/arch/arm64/boot/Image*

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel_sources/build.log
